syntax = "proto3";

package fishertimer.studytimer.v1;

option go_package = "github.com/neennera/fishertimer/proto/studytimer/v1;timerv1";

// StudyTimerService runs one independent timer per participant per room
// (UC-05). Every RPC that changes the timer returns its full state, so the
// caller never has to issue a follow-up GetTimer.
//
// Lifecycle of one timer (UC-05), see TimerStateResponse.state:
//   READY -> WORK_RUNNING <-> WORK_PAUSED -> (complete) -> READY_FOR_REST
//   READY_FOR_REST -> REST_RUNNING <-> REST_PAUSED -> (complete / skip) -> READY
// Stop discards the active cycle (no reward) and returns to READY. A timer is
// opened by Study Session's participant.joined event and FINALIZED by
// participant.left / session.ended; a finalized timer refuses every action.
service StudyTimerService {
  // Starts a work cycle (phase WORK, the default) or a rest period (phase
  // REST, only after a completed work cycle). duration_minutes 0 uses the
  // user's saved setting. A duplicate start while a cycle is active is ignored.
  rpc StartTimer(StartTimerRequest) returns (TimerStateResponse);
  // Reads the timer's current state and remaining time.
  rpc GetTimer(GetTimerRequest) returns (TimerStateResponse);
  // Reads all active participant timers for a room (session_id).
  rpc GetRoomTimers(GetRoomTimersRequest) returns (GetRoomTimersResponse);
  // Freezes the remaining time of a running timer.
  rpc PauseTimer(PauseTimerRequest) returns (TimerStateResponse);
  // Continues a paused timer from where it was frozen.
  rpc ResumeTimer(ResumeTimerRequest) returns (TimerStateResponse);
  // Discards the active cycle without a reward (UC-05 S-4).
  rpc StopTimer(StopTimerRequest) returns (TimerStateResponse);
  // Restarts the active cycle from its full length.
  rpc ResetTimer(ResetTimerRequest) returns (TimerStateResponse);
  // Completes the active cycle once its time is really up (server-checked,
  // idempotent). The server also completes cycles on its own.
  rpc CompleteCycle(CompleteCycleRequest) returns (TimerStateResponse);
  // Skips the rest period, running or not yet started.
  rpc SkipRest(SkipRestRequest) returns (TimerStateResponse);
  rpc UpdateTimerSetting(UpdateTimerSettingRequest) returns (TimerStateResponse);
  rpc TimerStatistics(TimerStatisticsRequest) returns (TimerStatisticsResponse);
}

enum TimerStatus {
  TIMER_STATUS_UNSPECIFIED = 0;
  TIMER_STATUS_STOPPED = 1;
  TIMER_STATUS_RUNNING = 2;
  TIMER_STATUS_PAUSED = 3;
}

enum TimerPhase {
  TIMER_PHASE_UNSPECIFIED = 0;
  TIMER_PHASE_WORK = 1;
  TIMER_PHASE_REST = 2;
}

message StartTimerRequest {
  string session_id = 1;
  string user_id = 2;
  // WORK when unspecified.
  TimerPhase phase = 3;
  // 0 = the user's saved default for this phase.
  int32 duration_minutes = 4;
}

message GetTimerRequest {
  string session_id = 1;
  string user_id = 2;
}

message PauseTimerRequest {
  string session_id = 1;
  string user_id = 2;
}

message ResumeTimerRequest {
  string session_id = 1;
  string user_id = 2;
}

message StopTimerRequest {
  string session_id = 1;
  string user_id = 2;
}

message ResetTimerRequest {
  string session_id = 1;
  string user_id = 2;
}

message CompleteCycleRequest {
  string session_id = 1;
  string user_id = 2;
}

message SkipRestRequest {
  string session_id = 1;
  string user_id = 2;
}

message UpdateTimerSettingRequest {
  string session_id = 1;
  string user_id = 2;
  int32 work_minutes = 3;
  int32 rest_minutes = 4;
}

message TimerStatisticsRequest {
  string user_id = 1;
}

message TimerStateResponse {
  string session_id = 1;
  string user_id = 2;
  TimerStatus status = 3;
  TimerPhase phase = 4;
  int32 work_minutes = 5;
  int32 rest_minutes = 6;
  int32 current_cycle = 7;
  // RFC 3339 timestamp of the last state change.
  string last_updated = 8;
  // Length of the current phase, in seconds.
  int32 duration_seconds = 9;
  // Time left in the current phase, computed by the server at response time.
  // Clients count down locally from this value and re-sync with GetTimer.
  int32 remaining_seconds = 10;
  // READY | WORK_RUNNING | WORK_PAUSED | READY_FOR_REST | REST_RUNNING |
  // REST_PAUSED | FINALIZED
  string state = 11;
  // The active cycle, when there is one.
  string cycle_id = 12;
  string started_at = 13;
  int32 paused_total_seconds = 14;
  // Focus time from work cycles completed during this stay in the room.
  int32 focus_seconds = 15;
  // The most recently completed work cycle (for the reward reveal).
  string last_completed_cycle_id = 16;
  string last_completed_at = 17;
  // Allowed ranges (UC-05 E-1) and the pause limit (E-3), in minutes.
  int32 min_work_minutes = 18;
  int32 max_work_minutes = 19;
  int32 min_rest_minutes = 20;
  int32 max_rest_minutes = 21;
  int32 max_pause_minutes = 22;
}

message TimerStatisticsResponse {
  string user_id = 1;
  int32 total_sessions = 2;
  int32 total_focus_minutes = 3;
  string last_active = 4;
  int32 cycles_completed = 5;
}

message GetRoomTimersRequest {
  string session_id = 1;
}

message GetRoomTimersResponse {
  repeated TimerStateResponse timers = 1;
}
