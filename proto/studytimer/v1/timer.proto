syntax = "proto3";

package fishertimer.studytimer.v1;

option go_package = "github.com/neennera/fishertimer/proto/studytimer/v1;timerv1";

service StudyTimerService {
  rpc StartTimer(StartTimerRequest) returns (TimerStateResponse);
  rpc PauseTimer(PauseTimerRequest) returns (TimerStateResponse);
  rpc ResumeTimer(ResumeTimerRequest) returns (TimerStateResponse);
  rpc StopTimer(StopTimerRequest) returns (TimerStateResponse);
  rpc ResetTimer(ResetTimerRequest) returns (TimerStateResponse);
  rpc CompleteCycle(CompleteCycleRequest) returns (TimerStateResponse);
  rpc SkipRest(SkipRestRequest) returns (TimerStateResponse);
  rpc UpdateTimerSetting(UpdateTimerSettingRequest) returns (TimerStateResponse);
  rpc TimerStatistics(TimerStatisticsRequest) returns (TimerStatisticsResponse);
}

message StartTimerRequest {
  string session_id = 1;
  string user_id = 2;
}

message PauseTimerRequest {
  string session_id = 1;
  string user_id = 2;
}

message ResumeTimerRequest {
  string session_id = 1;
  string user_id = 2;
}

message StopTimerRequest {
  string session_id = 1;
  string user_id = 2;
}

message ResetTimerRequest {
  string session_id = 1;
  string user_id = 2;
}

message CompleteCycleRequest {
  string session_id = 1;
  string user_id = 2;
}

message SkipRestRequest {
  string session_id = 1;
  string user_id = 2;
}

message UpdateTimerSettingRequest {
  string session_id = 1;
  string user_id = 2;
  int32 work_minutes = 3;
  int32 rest_minutes = 4;
}

message TimerStatisticsRequest {
  string user_id = 1;
}

message TimerStateResponse {
  string session_id = 1;
  string user_id = 2;
  string status = 3;
  string phase = 4;
  int32 work_minutes = 5;
  int32 rest_minutes = 6;
  int32 current_cycle = 7;
  string last_updated = 8;
}

message TimerStatisticsResponse {
  string user_id = 1;
  int32 total_sessions = 2;
  int32 total_focus_minutes = 3;
  string last_active = 4;
}
