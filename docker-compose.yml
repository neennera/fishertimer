services:
  # ----------------------------------------------------------------------------
  # 1. Relational Databases (PostgreSQL per Service)
  # ----------------------------------------------------------------------------
  auth-db:
    image: postgres:16-alpine
    container_name: fishertimer-auth-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: auth_db
    ports:
      - "5431:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  account-db:
    image: postgres:16-alpine
    container_name: fishertimer-account-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: account_db
    ports:
      - "5432:5432"
    volumes:
      - account_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d account_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  session-db:
    image: postgres:16-alpine
    container_name: fishertimer-session-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: session_db
    ports:
      - "5433:5432"
    volumes:
      - session_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d session_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  timer-db:
    image: postgres:16-alpine
    container_name: fishertimer-timer-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: timer_db
    ports:
      - "5434:5432"
    volumes:
      - timer_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d timer_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  admin-db:
    image: postgres:16-alpine
    container_name: fishertimer-admin-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: admin_db
    ports:
      - "5435:5432"
    volumes:
      - admin_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d admin_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. Document Databases (MongoDB per Service)
  # ----------------------------------------------------------------------------
  reward-db:
    image: mongo:7.0
    container_name: fishertimer-reward-db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongoadmin
      MONGO_INITDB_ROOT_PASSWORD: mongopassword
      MONGO_INITDB_DATABASE: reward_db
    ports:
      - "27017:27017"
    volumes:
      - reward_db_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  leaderboard-db:
    image: mongo:7.0
    container_name: fishertimer-leaderboard-db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongoadmin
      MONGO_INITDB_ROOT_PASSWORD: mongopassword
      MONGO_INITDB_DATABASE: leaderboard_db
    ports:
      - "27018:27017"
    volumes:
      - leaderboard_db_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  auth_db_data:
  account_db_data:
  session_db_data:
  timer_db_data:
  admin_db_data:
  reward_db_data:
  leaderboard_db_data:
