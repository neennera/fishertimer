# Local Kubernetes cluster for Fisher Timer (kind = Kubernetes IN Docker).
#
#   kind create cluster --config k8s/kind-config.yaml
#   kind delete cluster --name fishertimer
#
# Port mappings and node labels are fixed at creation time: changing this file
# means deleting and recreating the cluster.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
# scripts/build-images.sh loads images into the cluster with this name.
name: fishertimer
nodes:
  # One node is enough locally: it runs both the k8s control plane and our pods.
  - role: control-plane
    # ingress-nginx's kind manifest only schedules onto nodes with this label.
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    # The node is a Docker container; forward the Mac's ports 80/443 into it so
    # http://fishertimer.localhost reaches the Ingress controller.
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
