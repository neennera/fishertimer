# API gateway: the single entry point for the web app. Checks the session JWT
# and forwards /api/* to the services (HTTP: account, reward, leaderboard;
# gRPC: study-session, study-timer). Stateless, so a Deployment.
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      # No database and no init container: the gateway only forwards requests,
      # and its gRPC clients to session/timer connect lazily on the first call.
      containers:
        - name: api-gateway
          image: fishertimer/api-gateway:latest
          # :latest defaults to Always, which would look on Docker Hub. Use the
          # image `pnpm images` loaded into kind.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: fishertimer-config
            - secretRef:
                name: fishertimer-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          # distroless:nonroot runs as uid 65532 with no shell; lock the rest down.
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
